# ============================================================================
# Tomass Seguridad — App móvil
# ============================================================================
# Este archivo es la lista de compras del proyecto: le dice a Flutter qué
# herramientas de otras personas necesita descargar para funcionar.
#
# Para instalarlas, tu desarrollador corre:  flutter pub get
# ============================================================================

name: tomass_seguridad
description: Control de acceso para condominios, colegios y edificios.

# Evita que este proyecto se publique por error en internet
publish_to: "none"

# Número de versión. El número después del + es el que usan Google Play y la
# App Store para saber qué versión es más nueva.
version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # Los textos del sistema en español: los botones "Cancelar" y "Listo" de los
  # selectores de fecha y hora, los nombres de los meses, etc.
  # Sin esto, el selector de fecha en español se cae al abrirse.
  flutter_localizations:
    sdk: flutter

  # ---- Conexión con el servidor -------------------------------------------
  # Base de datos, login y avisos en vivo, todo en uno
  supabase_flutter: ^2.10.0

  # ---- Manejo del estado de la app ----------------------------------------
  # Coordina qué pantalla muestra qué datos. Es lo mismo que usa la app de
  # Merlyn Seguridad, así que tu desarrollador ya lo conoce.
  flutter_riverpod: ^2.6.1

  # ---- Navegación entre pantallas -----------------------------------------
  go_router: ^14.6.2

  # ---- Seguridad ----------------------------------------------------------
  # Guarda la sesión en la zona blindada del teléfono (Keychain en iPhone,
  # Keystore en Android), NO en el almacenamiento común.
  flutter_secure_storage: ^9.2.2

  # Huella digital y Face ID
  local_auth: ^2.3.0

  # ---- Códigos QR ---------------------------------------------------------
  # Dibuja el código en la pantalla del residente
  qr_flutter: ^4.1.0
  # Lee el código pegado en el muro con la cámara
  mobile_scanner: ^6.0.2

  # ---- Cámara y fotos -----------------------------------------------------
  image_picker: ^1.1.2
  # Lee la patente automáticamente de la foto
  google_mlkit_text_recognition: ^0.15.0

  # ---- Compartir por WhatsApp ---------------------------------------------
  share_plus: ^10.1.2

  # ---- Firma digital ------------------------------------------------------
  # El residente firma con el dedo en la tablet del guardia al retirar un paquete
  signature: ^5.5.0

  # ---- Modo sin internet --------------------------------------------------
  # Guarda en el teléfono lo que no se pudo enviar y lo manda cuando vuelve la
  # señal. Es lo que hace que la garita siga funcionando sin conexión.
  sqflite: ^2.4.1
  path: ^1.9.0
  # Avisa cuando se cae o vuelve el internet
  connectivity_plus: ^6.1.0

  # ---- Vibración ----------------------------------------------------------
  # Para que el celular vibre distinto según si el acceso fue aprobado o no.
  #
  # ⚠️ TIENE QUE SER LA VERSIÓN 3 O SUPERIOR. La 2.x se compila contra Android 33,
  #    y sus propias dependencias exigen 34 o más. Con la 2.x el APK NO compila:
  #    falla con "Execution failed for task ':vibration:checkDebugAarMetadata'".
  #    (Lo descubrimos compilando en GitHub el 27/07/2026.)
  vibration: ^3.2.0

  # ---- Avisos que suenan con la app cerrada -------------------------------
  # Firebase es el servicio gratuito de Google que hace sonar los celulares.
  #
  # ⚠️ La app FUNCIONA SIN ESTO CONFIGURADO. Si falta el archivo de Google, los
  #    avisos igual llegan al instante mientras la app está abierta, que es lo
  #    que ya venía andando. Lo único que falta en ese caso es que el teléfono
  #    suene con la app cerrada. Los pasos están en LEEME-AVISOS.md.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  # Para reconocer el aparato y no mandarle el mismo aviso cinco veces a alguien
  # que cambió de teléfono
  device_info_plus: ^11.2.0

  # ---- Ubicación ----------------------------------------------------------
  # Para los puntos de control de las rondas.
  #
  # Sin esto el sistema demuestra que alguien TUVO el código del cartel. Con
  # esto demuestra que ESTUVO AHÍ, que es lo que el cliente quiere saber.
  geolocator: ^13.0.2

  # ---- Informes en PDF ----------------------------------------------------
  # Para el informe de rondas y el de encomiendas que el administrador le
  # entrega al cliente, y para el cartel de cada sector de ronda.
  #
  #   pdf       arma el documento
  #   printing  lo abre, lo comparte por WhatsApp o lo manda a una impresora
  #   barcode   dibuja el código QR del cartel DENTRO del PDF, como líneas y
  #             no como una foto, para que salga nítido en cualquier tamaño de
  #             hoja. Ya venía incluida de rebote dentro de pdf; se pide en
  #             forma directa para poder usarla desde la app.
  #
  # Se genera EN EL TELÉFONO, no en el servidor. Así el administrador saca el
  # informe estando en la instalación, sin depender de que haya internet bueno.
  pdf: ^3.11.1
  printing: ^5.13.4
  barcode: ^2.2.9

  # Achica las fotos de las encomiendas antes de meterlas en el informe
  # semanal. Ya vienen comprimidas desde que se sacaron (ver servicio_fotos),
  # pero un informe con 50 fotos a ese tamaño pesaría demasiado para mandar
  # por WhatsApp con mala señal. Acá se las achica una vez más, solo para el
  # PDF: no se tocan las fotos originales.
  image: ^4.3.0

  # ---- Llamar por teléfono ------------------------------------------------
  # Para que el guardia toque el número del dueño de un auto y lo llame, sin
  # tener que copiarlo a mano.
  #
  # Ya venía incluida de rebote dentro de otra librería, pero se pide en forma
  # directa a propósito: si esa librería algún día deja de usarla, la app
  # dejaría de compilar sin motivo aparente.
  url_launcher: ^6.3.1

  # ---- Utilidades ---------------------------------------------------------
  # Fechas y números en formato chileno
  intl: ^0.20.1
  cupertino_icons: ^1.0.8

# ============================================================================
# UN EMPATE FORZADO, SOLO PARA QUE LA APP ARME EN IPHONE
# ============================================================================
# El lector de patentes (google_mlkit_text_recognition) y el lector de QR
# (mobile_scanner) usan, cada uno por su lado, una misma pieza interna de
# Google llamada MLKitVision. En Android no pasa nada. En iPhone, la versión
# que google_mlkit_commons trae de fábrica (0.11.1 en adelante) pide
# MLKitVision 10, y mobile_scanner pide MLKitVision 8: la app ni siquiera
# llega a compilar para iPhone, se cae en el primer intento.
#
# La propia librería del lector de patentes ya permite usar la versión
# anterior (0.11.0), que todavía pedía MLKitVision 8 y por lo tanto no choca
# con el lector de QR. Esta línea fuerza esa versión más vieja.
#
# El día de mañana, si se actualiza mobile_scanner a su versión 7 (que dejó
# de usar las piezas de Google en iPhone y pasó a usar las de Apple
# directamente), este empate ya no va a hacer falta y se puede sacar. Ese
# salto de versión no se hizo ahora a propósito: cambia demasiado el lector
# de QR, que es lo que los guardias usan todos los días, y no es algo para
# tocar a la ligera justo antes de salir a producción.
dependency_overrides:
  google_mlkit_commons: 0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Revisa el código y avisa de errores antes de compilar
  flutter_lints: ^5.0.0

  # ---- Solo para preparar el ícono de la app ------------------------------
  # Estas NO viajan dentro de la app instalada: son herramientas que se usan
  # una sola vez, acá en el computador, para armar los íconos.
  #
  #   flutter_launcher_icons → reparte el ícono en los 20 tamaños que pide cada
  #                            teléfono, para no tener que hacerlo a mano
  #   qr                    → dibuja los códigos QR de los carteles del muro
  #                            (herramientas/generar_carteles.dart). Ya venía
  #                            incluida dentro de qr_flutter; acá solo se pide
  #                            en forma directa para poder usarla desde afuera
  #                            de la app.
  #
  # (image ya no va acá: ahora también se usa DENTRO de la app para achicar
  # las fotos del informe de encomiendas, así que subió a "dependencies".)
  flutter_launcher_icons: ^0.14.3
  qr: ^3.0.2

# ============================================================================
# EL ÍCONO DE LA APP — el cuadradito que se ve en la pantalla del celular
# ============================================================================
# Para volver a generarlo (solo si cambia el logo de la empresa):
#
#   1. dart run herramientas/generar_icono.dart
#   2. dart run flutter_launcher_icons
#
# El primer paso arma las imágenes; el segundo las reparte en todos los tamaños.
#
# ⚠️ REVISAR DESPUÉS DEL PASO 2: la herramienta tiene un defecto conocido.
#    Al tocar el proyecto de iPhone se equivoca de renglón y le escribe
#    "AppIcon" a un ajuste que solo acepta YES o NO, en el archivo
#    ios/Runner.xcodeproj/project.pbxproj:
#
#        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS = AppIcon;
#
#    Ese cambio hay que descartarlo: el ajuste que la herramienta quería tocar
#    (ASSETCATALOG_COMPILER_APPICON_NAME) ya está bien puesto desde siempre.
#    Se descarta con:  git restore app/ios/Runner.xcodeproj/project.pbxproj
# ============================================================================
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true

  # El escudo sobre fondo grafito. Lo usan el iPhone y los Android antiguos.
  image_path: "marca/icono-app.png"

  # Android moderno arma el ícono con dos capas: un fondo de color y el dibujo
  # encima. Así el teléfono le puede dar la forma que el usuario prefiera.
  adaptive_icon_background: "#1C1E24"
  adaptive_icon_foreground: "marca/icono-adaptativo.png"

  # Sin margen extra. Esta herramienta, por su cuenta, le agrega un 16% de aire
  # alrededor. Pero el escudo YA viene con su margen puesto desde
  # herramientas/generar_icono.dart, y los dos márgenes se suman: el escudo
  # terminaba ocupando el 39% del cuadrito y se veía diminuto.
  adaptive_icon_foreground_inset: 0

  # El iPhone NO acepta íconos con transparencia: si la tiene, la App Store
  # rechaza la app. Esto le rellena el fondo con el mismo grafito.
  remove_alpha_ios: true
  background_color_ios: "#1C1E24"

flutter:
  uses-material-design: true

  # Carpeta donde va el logo y las imágenes
  assets:
    - assets/imagenes/
