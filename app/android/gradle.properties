# Tomass Seguridad — Ajustes de compilación de Android
# ============================================================================

# ---- Preferir IPv4 para las conexiones locales -----------------------------
# Es una buena práctica en Windows y no molesta. OJO: por sí sola NO resuelve el
# error "Unable to establish loopback connection" que aparece en este equipo.
# Ese problema es de Windows, no del proyecto. Ver el LEEME.md, sección
# "Si la compilación falla con Unable to establish loopback connection".
systemProp.java.net.preferIPv4Stack=true

# ---- Memoria para compilar -------------------------------------------------
# 8 GB de memoria es lo que pide la plantilla de Flutter. Si el equipo tiene
# poca RAM y la compilación falla por memoria, bajá el 8G a 4G.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# ---- Ajustes de Flutter (no tocar) -----------------------------------------
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
