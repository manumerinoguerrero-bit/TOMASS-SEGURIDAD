<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomass Seguridad — Ingresar</title>
  <meta name="description" content="Panel de administración de Tomass Seguridad Privada">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="pantalla-login">
  <main class="caja-login">
    <img src="img/logo.png" alt="Tomass Seguridad" class="logo">
    <h1>Panel de administración</h1>
    <p class="subtitulo">Ingresá con tu cuenta de Tomass Seguridad.</p>

    <form id="formLogin">
      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        name="email"
        required
        autocomplete="email"
        inputmode="email"
        placeholder="tu@correo.cl">

      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        name="password"
        required
        autocomplete="current-password"
        placeholder="••••••••">

      <button type="submit" id="btnLogin">Ingresar</button>
      <p class="error" id="mensajeError" hidden></p>
    </form>

    <p class="pie-login">
      Si no tenés acceso, pedile a Tomass Seguridad que te cree un usuario de
      administrador o mandante para tu instalación.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
