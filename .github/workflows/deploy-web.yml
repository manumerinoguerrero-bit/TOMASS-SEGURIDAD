# ============================================================================
# Tomass Seguridad — Publicar el dashboard web en GitHub Pages
# ============================================================================
# QUÉ HACE
#   Cada vez que se suben cambios a /web/ en main, publica esos archivos como
#   un sitio estático en GitHub Pages. El URL queda del tipo
#   https://manumerinoguerrero-bit.github.io/TOMASS-SEGURIDAD/
#
# CÓMO ACTIVARLO LA PRIMERA VEZ
#   1. Ir a Settings → Pages del repo en GitHub.
#   2. En "Source" elegir "GitHub Actions".
#   3. Eso es todo. El próximo push a main dispara este workflow y publica.
#
# POR QUÉ GH PAGES Y NO VERCEL/NETLIFY
#   GH Pages es gratis sin tope de ancho de banda razonable para esto, y
#   no requiere cuenta nueva ni variables secretas. Si en el futuro queremos
#   un dominio propio (admin.tomass.cl), se apunta con DNS CNAME.
# ============================================================================

name: Publicar dashboard web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# Permisos: deploy-pages necesita 'pages: write' + 'id-token: write'.
permissions:
  contents: read
  pages: write
  id-token: write

# Solo un deploy a la vez; si llega otro mientras hay uno en curso lo cancela.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
