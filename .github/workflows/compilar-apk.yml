# ============================================================================
# Tomass Seguridad — Compilar el APK en la nube
# ============================================================================
# QUÉ ES ESTO
#   Una receta que le dice a un computador de GitHub cómo compilar la app.
#   Cada vez que subas cambios, GitHub compila el APK solo, gratis, y te lo deja
#   listo para descargar e instalar en un celular.
#
# POR QUÉ SIRVE EN ESTE CASO
#   El computador de Manuel tiene rota una parte de la red de Windows que Java
#   necesita para compilar. Esto lo esquiva por completo: la compilación pasa en
#   un computador de GitHub que está sano, no en el tuyo.
#
# CUÁNTO CUESTA
#   Nada. GitHub da 2.000 minutos de compilación gratis por mes en repositorios
#   privados, y compilaciones ilimitadas si el repositorio es público. Esta app
#   tarda unos 6 minutos, así que alcanza de sobra.
#
# CÓMO USARLO
#   Está explicado paso a paso en el LEEME.md, sección
#   "Compilar el APK sin usar tu computador".
# ============================================================================

name: Compilar APK

# Cuándo compilar
on:
  # Cada vez que se suben cambios a la rama principal
  push:
    branches: [main, master]
  # Y también cuando aprietes el botón "Run workflow" a mano
  workflow_dispatch:

# Permisos necesarios para crear releases (leer + escribir contenido)
permissions:
  contents: write

jobs:
  compilar:
    name: Compilar el APK de Android
    runs-on: ubuntu-latest

    steps:
      # 1 · Traer el código del proyecto
      - name: Traer el código
        uses: actions/checkout@v4

      # 2 · Instalar Java (Android lo necesita para compilar)
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3 · Instalar Flutter, la misma versión que se usó para escribir la app
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      # 4 · Descargar las librerías que usa la app
      - name: Descargar dependencias
        working-directory: app
        run: flutter pub get

      # 5 · Revisar que el código no tenga errores.
      #     Si falla acá, la compilación se detiene: es a propósito, para que
      #     nunca se genere un APK a partir de código con problemas.
      - name: Revisar el código
        working-directory: app
        run: flutter analyze

      # 6 · Compilar el APK en modo RELEASE.
      #
      #     Antes usábamos --debug, y eso tenía dos problemas graves:
      #
      #       a) La app corría 3 a 5 veces más lenta y usaba más memoria.
      #       b) Cualquier tropiezo del framework mostraba una PANTALLA ROJA
      #          con texto amarillo y un stack trace de Flutter en vez de
      #          seguir andando. En un celular en manos de un guardia, eso se
      #          ve como si la app se hubiera roto.
      #
      #     En release la app es rápida, y si algo falla se muestra un aviso
      #     manejado por nosotros. La firma ya está configurada en
      #     android/app/build.gradle.kts apuntando a firma-pruebas.jks, así
      #     que Gradle firma el APK sin secretos adicionales.
      - name: Compilar el APK
        working-directory: app
        run: flutter build apk --release

      # 7 · Renombrar el APK con la fecha y el commit
      #     Antes se llamaba siempre "app-release.apk". Con la fecha en el
      #     nombre, el guardia ve al instalar cuál es el más nuevo y no hay
      #     que confiar en el timestamp del archivo.
      - name: Renombrar el APK
        working-directory: app
        run: |
          FECHA=$(date +'%Y-%m-%d-%H%M')
          COMMIT=$(echo "${{ github.sha }}" | cut -c1-7)
          cp build/app/outputs/flutter-apk/app-release.apk \
             tomass-seguridad-${FECHA}-${COMMIT}.apk

      # 8 · Publicar el APK como RELEASE (no como artifact)
      #
      #     Los artifacts de GitHub Actions tienen cuota (500 MB en el plan
      #     gratuito) y llenaron el espacio a los 60 workflows. Los RELEASES
      #     no tienen esa cuota, y además:
      #
      #       * Aparecen en el tab "Releases" del repo, más fáciles de
      #         compartir con los guardias.
      #       * Cada release trae el link directo al APK sin login.
      #       * El nombre del release es el título del commit, así que se ve
      #         qué trae cada APK sin abrir nada.
      #
      #     Cada push a main crea un release nuevo con tag "apk-<sha_corto>".
      #     Si se aprieta "Run workflow" a mano sobre el mismo commit, el
      #     release se sobreescribe.
      - name: Publicar el APK como Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}-${{ github.sha }}
          name: 'APK #${{ github.run_number }} · ${{ github.event.head_commit.message }}'
          body: |
            APK de Tomass Seguridad compilado automáticamente.

            **Commit:** ${{ github.sha }}
            **Mensaje:** ${{ github.event.head_commit.message }}
            **Compilado:** ${{ github.event.head_commit.timestamp }}

            Descargá el `.apk` de abajo e instalalo en el celular.
          files: app/tomass-seguridad-*.apk
          make_latest: true
          fail_on_unmatched_files: true
