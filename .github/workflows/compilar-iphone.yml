# ============================================================================
# Tomass Seguridad — Comprobar que la app arma para iPhone
# ============================================================================
# QUÉ ES ESTO
#
#   Una receta que arma la app para iPhone en un computador Mac de GitHub, para
#   comprobar que no tiene errores.
#
# POR QUÉ HACE FALTA
#
#   Una app de iPhone SOLO se puede armar en un computador Mac. No es una traba
#   de Flutter: es una regla de Apple. En Windows no hay forma, ni con trucos.
#   Esta receta pide prestado un Mac de GitHub por unos minutos.
#
# LO QUE ESTO SÍ HACE Y LO QUE NO
#
#   SÍ: comprueba que la app COMPILA para iPhone, que las piezas encajan y que
#       no hay errores. Es la única forma de saberlo sin comprar un Mac.
#
#   SÍ (con un paso más): deja para descargar un archivo .ipa SIN FIRMAR. No lo
#       instala un iPhone abriéndolo así nomás — Apple no lo permite sin cuenta
#       paga — pero programas como Sideloadly (gratis, corre en Windows) lo
#       toman y lo firman ellos mismos con un Apple ID gratuito, para instalarlo
#       en UN iPhone conectado por cable. Se vence a los 7 días: es la letra
#       chica de Apple para todo lo que no pasa por una cuenta paga, no un
#       límite de esta receta. Ver LEEME-IPHONE.md para los pasos con Sideloadly.
#
#   NO: no reemplaza la cuenta de desarrollador para repartir la app a otras
#       personas (guardias, apoderados) sin tocarles el teléfono. Para eso sigue
#       haciendo falta TestFlight, que exige la cuenta paga de Apple.
#
# ⚠️ POR QUÉ NO SE EJECUTA SOLA EN CADA CAMBIO
#
#   Los minutos de Mac se cobran DIEZ VECES más caro que los normales. Con los
#   2.000 minutos gratis que da GitHub por mes, esta receta se puede correr unas
#   quince veces; la de Android, cientos.
#
#   Por eso arranca solo cuando vos apretás el botón. Si se ejecutara en cada
#   cambio, en dos semanas te quedarías sin minutos y se te caerían TAMBIÉN las
#   compilaciones de Android, que son las que usás todos los días.
#
# CÓMO USARLA
#
#   En GitHub: pestaña "Comportamiento" (Actions) → en la lista de la izquierda
#   elegí "Comprobar iPhone" → botón "Run workflow".
# ============================================================================

name: Comprobar iPhone

on:
  # Solo a mano, a propósito. Ver la advertencia de arriba.
  workflow_dispatch:

jobs:
  comprobar:
    name: Armar la app para iPhone
    runs-on: macos-latest

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Descargar dependencias
        working-directory: app
        run: flutter pub get

      - name: Revisar el código
        working-directory: app
        run: flutter analyze

      # Acá es donde aparecen los problemas propios de iPhone: piezas que piden
      # una versión de iOS más nueva que la declarada, o que directamente no
      # existen para iPhone.
      - name: Instalar las piezas de iPhone
        working-directory: app/ios
        run: pod install --repo-update

      - name: Armar la app para iPhone
        working-directory: app
        run: flutter build ios --debug --no-codesign

      # Un .ipa es, por dentro, un archivo .zip con una carpeta "Payload" que
      # contiene la app. Acá se arma esa carpeta a mano y se comprime: es
      # exactamente lo que espera un programa como Sideloadly para poder
      # firmarlo con un Apple ID gratuito e instalarlo en un iPhone por cable.
      - name: Empaquetar como .ipa (sin firmar)
        working-directory: app
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r tomass-seguridad-sin-firmar.ipa Payload

      # Se guarda 7 días a propósito: es lo que dura instalada la app firmada
      # con un Apple ID gratuito. Pasado ese tiempo, este archivo ya no sirve
      # para nada nuevo, así que no tiene sentido guardarlo más tiempo.
      - name: Dejar el .ipa para descargar
        uses: actions/upload-artifact@v4
        with:
          name: tomass-seguridad-ipa-sin-firmar
          path: app/tomass-seguridad-sin-firmar.ipa
          retention-days: 7

      - name: Contar cómo fue
        if: always()
        run: |
          echo "Si este paso dice que todo salió bien, la app arma para iPhone."
          echo "Más abajo en esta misma página, en 'Artifacts', está el archivo"
          echo "tomass-seguridad-ipa-sin-firmar para bajar e instalar con"
          echo "Sideloadly. Dura 7 días. Ver LEEME-IPHONE.md para los pasos."
          echo ""
          echo "Para repartirla a guardias o apoderados sin tocarles el"
          echo "teléfono, sigue haciendo falta la cuenta de desarrollador de"
          echo "Apple (99 dolares al ano) y TestFlight."
